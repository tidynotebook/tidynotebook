# Compose override that gives the application a mail transport.
#
# An installation that opens registration, and one that sends invitations and
# password resets by mail, needs it. The SMTP URL holds a password, so it is a
# secret file and never a value in `.env`. Name this file after the main one:
#
#   COMPOSE_FILE=docker-compose.yml:docker/compose.mail.yaml
#
# An administrator can set the mail server in the application instead, with
# no file and no restart. This override wins over that page and locks it.
#
# Write the URL, for example `smtps://user:password@smtp.example.com:465`, to
# `smtp_url` in NOTESAPP_SECRETS_DIR with mode 0600 and owner uid 10001, and
# set NOTESAPP_MAIL_FROM in `.env`. See docs/guide/self-hosting.md.
services:
  app:
    environment:
      NOTESAPP_SMTP_URL_FILE: /run/secrets/smtp_url
      NOTESAPP_MAIL_FROM: ${NOTESAPP_MAIL_FROM:?Set NOTESAPP_MAIL_FROM in .env. It names the sender of every message, for example NotesApp <no-reply@notes.example.com>.}
    secrets:
      - smtp_url

secrets:
  smtp_url:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/smtp_url
