openapi: 3.1.2
info:
  title: notesapp API
  version: 0.1.0
  summary: Application HTTP contract for notesapp.
  description: >-
    This document is the authoritative HTTP interface of notesapp. Every
    application HTTP call in the web app and the sync engine uses an operation
    generated from this document. Errors use RFC 9457 problem details with a
    stable application code.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: notesapp maintainers
    url: https://notesapp.invalid/support
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://notes.invalid
    description: >-
      This is a placeholder address. Use the HTTPS origin of your own
      installation in your client or API tool. Replace the placeholder before
      you send a request. The generated client takes the address from its
      configuration.
tags:
  - name: service
    description: Service state operations used by operators and load balancers.
  - name: accounts
    description: The signed in account and the settings that follow it.
  - name: administration
    description: >-
      Accounts, invitations, and the settings of the installation. Only an
      administrator reaches these operations, and none of them reads a note.
  - name: workspaces
    description: Workspace containers for the files of an account.
  - name: files
    description: >-
      Files, their immutable revisions, and the atomic changesets that accept
      them.
  - name: publishing
    description: >-
      Read-only links that an owner makes over one note or one folder.
  - name: published
    description: >-
      The reader path of a published link. No operation of this tag names a
      security scheme, so no identity hook runs for one.
  - name: legal
    description: >-
      The terms and the privacy notice that the operator of the installation
      writes. A person reads them with no account.
  - name: auth
    description: >-
      Authentication protocol endpoints. Better Auth implements them; the
      contract records their shapes so the generated client owns every call.
  - name: mcp
    description: The opt-in remote Model Context Protocol endpoint.
  - name: operator
    description: >-
      Operations of a service of the operator, such as a billing service
      (record 0190). They take the operator token and no session, set no
      cookie, and never read or write a note, a workspace or a published
      link.
security:
  - sessionCookie: []
  - personalApiKey: []
