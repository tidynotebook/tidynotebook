type: object
description: The number of other accounts with a note open.
additionalProperties: false
required:
  - fileId
  - accountCount
properties:
  fileId:
    $ref: './Uuid.yaml'
  accountCount:
    type: integer
    minimum: 1
    maximum: 32
  colorSlots:
    type: array
    minItems: 1
    maxItems: 3
    items:
      type: integer
      minimum: 0
      maximum: 5
