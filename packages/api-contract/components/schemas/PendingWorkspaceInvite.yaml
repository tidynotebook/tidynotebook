type: object
description: An active invitation with no link or secret.
additionalProperties: false
required:
  - invitationId
  - workspaceId
  - workspaceName
  - email
  - role
  - inviterName
  - expiresAt
  - acceptanceMessage
  - seatOwnerName
properties:
  seatOwnerName:
    type: [string, 'null']
    maxLength: 256
    description: Name of the owner when seats are limited, or null when they are unlimited.
  acceptanceMessage:
    description: Why the current owner setting prevents acceptance, or null when it permits acceptance.
    type:
      - string
      - 'null'
    maxLength: 256
  invitationId:
    $ref: './Uuid.yaml'
  workspaceId:
    $ref: './Uuid.yaml'
  workspaceName:
    type: string
    minLength: 1
    maxLength: 200
  email:
    $ref: './EmailAddress.yaml'
  role:
    $ref: './WorkspaceInviteRole.yaml'
  inviterName:
    type:
      - string
      - 'null'
    minLength: 1
    maxLength: 256
  expiresAt:
    type: string
    format: date-time
