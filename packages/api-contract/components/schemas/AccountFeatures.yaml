type: object
description: >-
  The switch of each feature that a later design makes switchable (record
  0189). Every switch is on by default, and a self-hosted installation never
  needs to turn one off.
additionalProperties: false
required:
  - teams
  - collaboration
properties:
  teams:
    type: boolean
    readOnly: true
    description: Whether the account can use teams.
  collaboration:
    type: boolean
    readOnly: true
    description: Whether the account can use collaboration.
