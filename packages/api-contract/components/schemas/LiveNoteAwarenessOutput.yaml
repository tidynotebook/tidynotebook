type: object
description: Deliver a y-protocols awareness message with server-verified identity.
additionalProperties: false
required:
  - kind
  - roomId
  - payload
properties:
  kind:
    type: string
    const: noteAwareness
  roomId:
    $ref: './Uuid.yaml'
  payload:
    type: string
    minLength: 4
    pattern: ^[A-Za-z0-9+/]*={0,2}$
    maxLength: 5464
