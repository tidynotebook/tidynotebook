type: object
description: Confirm the room, epoch and current access.
additionalProperties: false
required:
  - kind
  - roomId
  - epoch
  - role
properties:
  kind:
    type: string
    const: noteJoined
  roomId:
    $ref: './Uuid.yaml'
  epoch:
    $ref: './DocumentEpoch.yaml'
  role:
    $ref: './Role.yaml'
  colorSlot:
    description: The joining member's color slot in this workspace.
    type: integer
    minimum: 0
    maximum: 2147483647
