type: object
description: A page of active invitations for the verified address of the signed in account.
additionalProperties: false
required:
  - invitations
  - nextAfterInvitationId
properties:
  invitations:
    type: array
    maxItems: 100
    items:
      $ref: './PendingWorkspaceInvite.yaml'
  nextAfterInvitationId:
    oneOf:
      - $ref: './Uuid.yaml'
      - type: 'null'
