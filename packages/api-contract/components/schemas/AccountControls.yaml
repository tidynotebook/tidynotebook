type: object
description: >-
  The controls of one account and their revision (record 0189). With no
  setting of the operator, an account is active, has every feature, and has
  no text, transfer or download limit.
additionalProperties: false
required:
  - revision
  - standing
  - removalAt
  - limitBytes
  - textLimitBytes
  - publishedTransferLimitBytes
  - downloadLimitBytes
  - features
properties:
  revision:
    allOf:
      - $ref: './ControlRevision.yaml'
    readOnly: true
    description: The revision of these controls.
  standing:
    allOf:
      - $ref: './AccountStanding.yaml'
    readOnly: true
    description: Whether the account is active or locked.
  removalAt:
    oneOf:
      - type: string
        format: date-time
        maxLength: 64
      - type: 'null'
    readOnly: true
    description: >-
      The instant after which the daily run removes a locked account, or
      null. Only a locked account has one (record 0201).
  limitBytes:
    allOf:
      - $ref: './ByteCount.yaml'
    readOnly: true
    description: >-
      The most bytes that the workspaces of the account can use (record
      0112).
  textLimitBytes:
    allOf:
      - $ref: './ByteLimit.yaml'
    readOnly: true
    description: >-
      The most bytes of text and history that the workspaces of the account
      can use, inside the storage limit, or null for no limit.
  publishedTransferLimitBytes:
    allOf:
      - $ref: './ByteLimit.yaml'
    readOnly: true
    description: >-
      The most bytes that the published pages of the account send in one
      calendar month in UTC, or null for no limit (record 0193).
  downloadLimitBytes:
    allOf:
      - $ref: './ByteLimit.yaml'
    readOnly: true
    description: >-
      The most bytes that the account downloads in one calendar month in UTC,
      or null for no limit (record 0193).
  features:
    allOf:
      - $ref: './AccountFeatures.yaml'
    readOnly: true
    description: The switch of each switchable feature.
