type: object
description: The signed in account and its settings.
additionalProperties: false
required:
  - accountId
  - installationRole
  - storage
  - preferences
  - consentRequired
properties:
  accountId:
    allOf:
      - $ref: './Uuid.yaml'
    readOnly: true
    description: Stable identifier of the account inside this deployment.
  email:
    type:
      - string
      - 'null'
    readOnly: true
    description: Sign-in address, or null when no address is linked.
    maxLength: 320
  name:
    type:
      - string
      - 'null'
    readOnly: true
    description: Display name, or null when no name is stored.
    maxLength: 256
  installationRole:
    allOf:
      - $ref: './InstallationRole.yaml'
    readOnly: true
    description: The role of the account in the installation.
  storage:
    allOf:
      - $ref: './AccountStorage.yaml'
    readOnly: true
    description: The usage and the limit of the account.
  preferences:
    allOf:
      - $ref: './Preferences.yaml'
    readOnly: true
    description: The stored settings of the account.
  consentRequired:
    type: boolean
    readOnly: true
    description: >-
      Whether the account must accept the current legal documents before the
      application opens (record 0120).
