type: object
description: A contributor in History. A former member has no name or account ID in this view.
additionalProperties: false
required:
  - accountId
  - displayName
  - formerMember
properties:
  accountId:
    oneOf:
      - $ref: './Uuid.yaml'
      - type: 'null'
  displayName:
    type:
      - string
      - 'null'
    minLength: 1
    maxLength: 256
  formerMember:
    type: boolean
  colorSlot:
    description: The current member's color slot in this workspace.
    type: integer
    minimum: 0
    maximum: 2147483647
