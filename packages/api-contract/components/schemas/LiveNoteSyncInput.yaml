type: object
description: Send a standard y-protocols sync message.
additionalProperties: false
required:
  - kind
  - roomId
  - payload
properties:
  kind:
    type: string
    const: sendNoteSync
  roomId:
    $ref: './Uuid.yaml'
  payload:
    description: Base64 encoding of one y-protocols sync message of at most 64 KiB.
    type: string
    minLength: 4
    pattern: ^[A-Za-z0-9+/]*={0,2}$
    maxLength: 87384
