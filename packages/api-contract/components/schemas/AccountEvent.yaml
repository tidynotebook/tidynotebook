type: object
description: One account event. Membership events also name the workspace and the remaining membership count.
additionalProperties: false
required:
  - cursor
  - accountId
  - kind
  - occurredAt
properties:
  cursor:
    allOf:
      - $ref: './AccountEventCursor.yaml'
    readOnly: true
    description: The position of the event.
  accountId:
    allOf:
      - $ref: './Uuid.yaml'
    readOnly: true
    description: Identifier of the account.
  kind:
    allOf:
      - $ref: './AccountEventKind.yaml'
    readOnly: true
    description: What happened.
  occurredAt:
    type: string
    readOnly: true
    description: Instant at which it happened.
    format: date-time
    maxLength: 64
  ownerAccountId:
    $ref: './Uuid.yaml'
  memberAccountId:
    $ref: './Uuid.yaml'
  workspaceId:
    $ref: './Uuid.yaml'
  ownerWorkspaceMemberships:
    type: integer
    minimum: 0
    description: The number of workspaces of this owner that the member belongs to after the change.
