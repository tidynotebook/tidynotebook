type: object
description: Settings that follow one account to every device.
additionalProperties: false
required:
  - appearance
  - themeFamily
  - spellCheck
  - themes
properties:
  appearance:
    allOf:
      - $ref: './Appearance.yaml'
    readOnly: true
    description: The stored appearance choice of the account.
  themeFamily:
    allOf:
      - $ref: './ThemeFamily.yaml'
    readOnly: true
    description: The stored theme family of the account.
  spellCheck:
    type: boolean
    readOnly: true
    description: >-
      True when the editor asks the browser to check the spelling of a
      note.
  themes:
    type: array
    readOnly: true
    description: The themes that the account imported, oldest first.
    maxItems: 20
    items:
      $ref: './ImportedTheme.yaml'
