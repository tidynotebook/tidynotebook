type: object
description: A page of current members ordered by account ID, with the current total count.
additionalProperties: false
required:
  - members
  - nextAfterAccountId
  - memberCount
properties:
  members:
    type: array
    maxItems: 100
    items:
      $ref: './WorkspaceMember.yaml'
  nextAfterAccountId:
    oneOf:
      - $ref: './Uuid.yaml'
      - type: 'null'
  memberCount:
    type: integer
    minimum: 1
