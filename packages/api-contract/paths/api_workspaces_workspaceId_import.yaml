post:
  operationId: importWorkspace
  summary: Import a portable workspace zip archive.
  description: >-
    Reads Markdown files and image files at their archive paths. An image
    outside the attachments folder moves into it, and a wiki link whose
    target is in the archive becomes a standard link (record 0172). The
    settings of a tool and every other kind of file are left out, and the
    answer counts them. Every imported path must be free in the workspace. The gap between two chunks of the
    archive is bounded, so a sender that stops in the middle is answered
    and does not hold its slot. The operation takes every archive that
    exportWorkspace answers: up to 65534 files and 4 GiB without ZIP64. A
    refused archive answers archive_invalid, archive_too_many_files or
    archive_too_large. Record 0170 bounds the work: one import or export
    of an account runs at once (429 archive_job_running) and a few of the
    installation (503 archive_jobs_busy, with Retry-After), a body that the
    storage cannot hold answers 507 storage_full before it is read, and
    every file is checked before the first commit, so only a failure of
    the service stops an import after it (503 import_incomplete, which
    states how many files came in).
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
  requestBody:
    $ref: '../components/requestBodies/ImportWorkspace.yaml'
  responses:
    '200':
      $ref: '../components/responses/WorkspaceImported.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '408':
      $ref: '../components/responses/RequestTimeout.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../components/responses/UnprocessableContent.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '429':
      $ref: '../components/responses/RateLimited.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
    '503':
      $ref: '../components/responses/ServiceBusy.yaml'
    '507':
      $ref: '../components/responses/InsufficientStorage.yaml'
