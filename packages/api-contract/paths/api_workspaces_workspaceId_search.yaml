get:
  operationId: searchFiles
  summary: Search accepted live notes in a workspace.
  description: >-
    Searches the accepted names of notes and the text that a reader of
    each note sees, with no Markdown mark and no link address. One text
    configuration serves every language: it is the PostgreSQL simple
    configuration with the unaccent filter, so it has no stemming and no
    stop words, and a letter with an accent matches the same letter
    without one. A word of the query of three characters or more
    matches as a prefix, and a shorter word matches only itself. Deleted
    files and historic revisions are excluded.
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
    - $ref: '../components/parameters/SearchQuery.yaml'
    - $ref: '../components/parameters/SearchLimit.yaml'
  responses:
    '200':
      $ref: '../components/responses/SearchResults.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
