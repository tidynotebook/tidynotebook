post:
  operationId: restoreFile
  summary: Bring one deleted file back into the file tree.
  description: >-
    Writes one revision on top of the tombstone that un-deletes the file
    with the content of its last revision before the deletion. The
    tombstone is the expected head, so a change that arrived after the
    deletion answers 412 and nothing is written. The file keeps its
    identifier, so every link to it and its whole history stay valid.
    The file goes back to the path it held before the deletion. If a live
    file already holds that path, the answer restores the file beside it
    under the name plus " (restored)" in the same folder, so a restore
    never overwrites live work. A file that is not deleted answers 404, and
    a permanently purged one answers 410.
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
    - $ref: '../components/parameters/FileId.yaml'
  requestBody:
    $ref: '../components/requestBodies/RestoreFile.yaml'
  responses:
    '200':
      $ref: '../components/responses/FileChange.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
    '410':
      $ref: '../components/responses/Gone.yaml'
    '412':
      $ref: '../components/responses/PreconditionFailed.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../components/responses/UnprocessableContent.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
