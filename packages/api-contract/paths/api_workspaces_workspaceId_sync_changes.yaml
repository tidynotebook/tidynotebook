get:
  operationId: getChanges
  summary: Read ordered incremental changes after a cursor.
  description: >-
    Reads the commit ordered change records after a cursor the client
    already applied, oldest first. Every relevant write allocates its
    cursor under the workspace lock, so the stream cannot skip a file
    transaction that commits late. A page never splits a commit, so the
    next cursor never passes a record of it. Change records are kept for 90 days; an
    older cursor
    answers 410 with the code snapshot_required, while saved revision
    identifiers stay valid beyond that window.
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
    - $ref: '../components/parameters/SyncCursor.yaml'
    - $ref: '../components/parameters/SyncLimit.yaml'
  responses:
    '200':
      $ref: '../components/responses/SyncChanges.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '410':
      $ref: '../components/responses/SnapshotRequired.yaml'
    '422':
      $ref: '../components/responses/UnprocessableContent.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
    '503':
      $ref: '../components/responses/SyncProtocolUnsupported.yaml'
