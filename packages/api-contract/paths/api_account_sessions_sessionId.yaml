delete:
  operationId: revokeSession
  summary: End one session of the signed in account.
  description: >-
    Ends one session of the account, for example on a lost device. A session
    of another account answers not found.
  tags:
    - accounts
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/SessionId.yaml'
  responses:
    '200':
      $ref: '../components/responses/Removed.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
