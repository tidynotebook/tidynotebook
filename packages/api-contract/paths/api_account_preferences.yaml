put:
  operationId: updatePreferences
  summary: Change the stored settings of the signed in account.
  description: >-
    Stores the settings that the body names, and they follow the account to
    every device. A member that the body leaves out keeps its stored value.
    The theme family selects the palette, the appearance selects the light
    variant, the dark variant, or the one that matches the device, and the
    spell check turns the spelling marks of the editor on or off.
  tags:
    - accounts
  security:
    - sessionCookie: []
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
  requestBody:
    $ref: '../components/requestBodies/PreferencesUpdate.yaml'
  responses:
    '200':
      $ref: '../components/responses/Preferences.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
