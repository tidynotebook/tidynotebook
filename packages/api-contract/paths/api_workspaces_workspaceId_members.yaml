get:
  operationId: listWorkspaceMembers
  summary: Read the members of one workspace.
  description: >-
    Only a member can read its co-member names, addresses and roles. An installation role grants no access.
  tags:
    - workspaces
  security:
    - sessionCookie: []
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
    - $ref: '../components/parameters/AfterAccountId.yaml'
  responses:
    '200':
      $ref: '../components/responses/WorkspaceMemberPage.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
