post:
  operationId: createPublishedLink
  summary: Publish a read-only link to one note or one folder.
  description: >-
    Makes one read-only link over one note, or over one folder and every
    note below it. The answer holds the token of the new link. The server
    keeps only a digest of that token, so this is the one time that the
    value exists outside the address that the owner copies. A workspace
    holds a bounded number of links, and a request past that bound is
    refused.
  tags:
    - publishing
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
  requestBody:
    $ref: '../components/requestBodies/CreatePublishedLink.yaml'
  responses:
    '201':
      $ref: '../components/responses/PublishedLinkCreated.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../components/responses/UnprocessableContent.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
get:
  operationId: listPublishedLinks
  summary: List the published links of a workspace.
  description: >-
    Reports every published link of the workspace, what it opens, when it
    expires, and whether it has a password. No entry holds a token and no
    entry holds a part of one, so a read of this list opens nothing. The
    answer reports no reader count, because the reader path counts nothing.
  tags:
    - publishing
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
  responses:
    '200':
      $ref: '../components/responses/PublishedLinkList.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
