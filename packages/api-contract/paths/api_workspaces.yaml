get:
  operationId: listWorkspaces
  summary: List every workspace of the signed in account.
  description: >-
    Lists the workspaces that the account is a member of, with the current
    role in each. An account never sees a workspace it does not belong to.
  tags:
    - workspaces
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
  responses:
    '200':
      $ref: '../components/responses/WorkspaceList.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
post:
  operationId: createWorkspace
  summary: Create a workspace owned by the signed in account.
  description: >-
    Creates a workspace whose only member is the account that created it,
    as its owner.
  tags:
    - workspaces
  security:
    - sessionCookie: []
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
  requestBody:
    $ref: '../components/requestBodies/WorkspaceName.yaml'
  responses:
    '201':
      $ref: '../components/responses/Workspace.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
