get:
  operationId: getFile
  summary: Read a file and the content of its accepted head.
  description: >-
    Reports the metadata of one live file and the Markdown of its accepted
    head revision, and the document of the note unless the caller asks for
    the text alone. The answer carries a strong entity tag that names that
    revision, so a later conditional read answers 304 and a later
    conditional write answers 412 when the head has moved. If-None-Match
    with that tag, or with *, answers 304. A deleted file answers 404; its
    revisions stay readable.
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
    - $ref: '../components/parameters/FileId.yaml'
    - $ref: '../components/parameters/FileReadContent.yaml'
    - $ref: '../components/parameters/IfNoneMatch.yaml'
  responses:
    '200':
      $ref: '../components/responses/File.yaml'
    '304':
      $ref: '../components/responses/NotModified.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '410':
      $ref: '../components/responses/Gone.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
put:
  operationId: updateFile
  summary: Replace the content or the path of a file.
  description: >-
    Writes one revision of an existing file. The request must carry the
    entity tag of the head that the client saw in If-Match; a request
    without it, and a request that carries *, both answer 428, and a head
    that has moved answers 412. The request states the new text, the new
    path, or both; a member that is absent keeps the value of the expected
    head. The answer carries the accepted revision without its text.
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
    - $ref: '../components/parameters/FileId.yaml'
    - $ref: '../components/parameters/IfMatch.yaml'
  requestBody:
    $ref: '../components/requestBodies/UpdateFile.yaml'
  responses:
    '200':
      $ref: '../components/responses/FileChange.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
    '410':
      $ref: '../components/responses/Gone.yaml'
    '412':
      $ref: '../components/responses/PreconditionFailed.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../components/responses/UnprocessableContent.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '428':
      $ref: '../components/responses/PreconditionRequired.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
delete:
  operationId: deleteFile
  summary: Delete a file by writing a tombstone revision.
  description: >-
    Deletes one file. The deletion is a revision, so the history of the
    file stays complete and a later restore is possible. The tombstone
    carries no note text, and a submitted tombstone that carries Markdown
    is refused with 422, so a deletion can never add content. Deleting
    removes the file from search, so a workspace at its storage limit can
    still be tidied. The request must carry the entity tag of the head
    that the client saw.
  tags:
    - files
  parameters:
    - $ref: '../components/parameters/RequestId.yaml'
    - $ref: '../components/parameters/WorkspaceId.yaml'
    - $ref: '../components/parameters/FileId.yaml'
    - $ref: '../components/parameters/IfMatch.yaml'
  requestBody:
    $ref: '../components/requestBodies/DeleteFile.yaml'
  responses:
    '200':
      $ref: '../components/responses/FileChange.yaml'
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '401':
      $ref: '../components/responses/Unauthorized.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '404':
      $ref: '../components/responses/NotFound.yaml'
    '409':
      $ref: '../components/responses/Conflict.yaml'
    '410':
      $ref: '../components/responses/Gone.yaml'
    '412':
      $ref: '../components/responses/PreconditionFailed.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '422':
      $ref: '../components/responses/UnprocessableContent.yaml'
    '423':
      $ref: '../components/responses/AccountLocked.yaml'
    '428':
      $ref: '../components/responses/PreconditionRequired.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
