get:
  operationId: getSetupStatus
  summary: Report whether the first account exists and who can make one.
  description: Reports if first-run setup is complete without exposing account data.
  tags:
    - auth
  security: []
  responses:
    '200':
      description: The setup state.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - initialized
              - openRegistration
              - legalDocuments
            properties:
              initialized:
                type: boolean
                readOnly: true
              openRegistration:
                type: boolean
                readOnly: true
                description: >-
                  Whether a person can ask for an account without an
                  invitation (record 0114).
              legalDocuments:
                oneOf:
                  - $ref: '../components/schemas/LegalDocuments.yaml'
                  - type: 'null'
                description: >-
                  The terms and the privacy notice, or null when the
                  installation names none (record 0120).
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '429':
      $ref: '../components/responses/RateLimited.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
post:
  operationId: createOwner
  summary: Create the first account during first-run setup.
  description: >-
    Creates the first account of the installation as its administrator and
    signs it in. This operation is refused after the first account exists.
    Every later account comes in through an invitation.
  tags:
    - auth
  security: []
  requestBody:
    description: The email address and password of the first account.
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - email
            - password
          properties:
            email:
              $ref: '../components/schemas/EmailAddress.yaml'
            password:
              $ref: '../components/schemas/Password.yaml'
  responses:
    '201':
      description: The first account was created and signed in.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - initialized
            properties:
              initialized:
                type: boolean
                readOnly: true
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '403':
      $ref: '../components/responses/Forbidden.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '415':
      $ref: '../components/responses/UnsupportedMediaType.yaml'
    '429':
      $ref: '../components/responses/RateLimited.yaml'
    '500':
      $ref: '../components/responses/ServerError.yaml'
