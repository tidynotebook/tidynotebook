name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NOTESAPP_COVERAGE: 'off'

jobs:
  scope:
    name: Change scope
    permissions:
      contents: read
      checks: read
      actions: read
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      base: ${{ steps.scope.outputs.base }}
      source: ${{ steps.scope.outputs.source }}
      image: ${{ steps.scope.outputs.image }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci-scope.mjs

  static:
    name: Static
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action is part of the checked out event commit.
      - if: needs.scope.outputs.source == 'true'
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - if: needs.scope.outputs.source == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install only the locked document formatter
        if: needs.scope.outputs.source == 'false'
        run: |
          node tools/ci-docs.mjs prepare
          npm ci --prefix "$RUNNER_TEMP/ci-format" --ignore-scripts --no-audit --no-fund
      - name: Check documents
        if: needs.scope.outputs.source == 'false'
        env:
          DOCS_BASE: ${{ needs.scope.outputs.base }}
        run: node tools/ci-docs.mjs check
      - name: Check source and bundle budget
        if: needs.scope.outputs.source == 'true'
        run: pnpm contract:lint && pnpm generated:check && pnpm typecheck && pnpm lint && pnpm format:check && pnpm perf:bundle

  unit:
    name: Unit ${{ matrix.shard }}/3
    needs: scope
    if: needs.scope.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action is part of the checked out event commit.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - run: pnpm build
      - if: matrix.shard == 1
        run: pnpm lint:types
      - name: Run unit shard
        env:
          SHARD: ${{ matrix.shard }}
        run: node tools/run-tests.mjs unit --shard="$SHARD/3"

  integration:
    name: Integration ${{ matrix.shard }}/4
    needs: scope
    if: needs.scope.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action is part of the checked out event commit.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - name: Start this runner's services
        run: docker compose -p notesapp-test -f compose.test.yaml up -d --wait
      - run: pnpm build
      - run: tools/test-database/ensure-postgres.sh && tools/test-database/ensure-minio.sh
      - name: Run integration shard
        env:
          SHARD: ${{ matrix.shard }}
        run: node tools/run-tests.mjs integration --shard="$SHARD/4"
      - if: always()
        run: docker compose -p notesapp-test -f compose.test.yaml down --volumes

  image:
    name: Image smoke
    needs: scope
    if: needs.scope.outputs.image == 'true' && github.ref != 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTESAPP_ORIGIN: https://notes.example.com
      NOTESAPP_BIND_HOST: 127.0.0.1
      NOTESAPP_PORT: '3000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action is part of the checked out event commit.
      - uses: ./.github/actions/image # zizmor: ignore[self-repository]

  image_main:
    name: Image smoke and cache export
    needs: scope
    if: needs.scope.outputs.image == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTESAPP_ORIGIN: https://notes.example.com
      NOTESAPP_BIND_HOST: 127.0.0.1
      NOTESAPP_PORT: '3000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action is part of the checked out event commit.
      - uses: ./.github/actions/image # zizmor: ignore[self-repository]

  image_arm64:
    name: Image compliance arm64
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: ./.github/actions/cache-runtime # zizmor: ignore[self-repository]
      - name: Build native arm64 image
        env:
          ARCH: arm64
          CACHE_WRITE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: node tools/ci-cache.mjs native --load --platform linux/arm64 --tag notesapp:latest .
      - name: Check arm64 sources and notices
        run: node --test tests/image/distribution-notices.test.ts

  workflows:
    name: Workflow lint
    # Static finishes before this job starts, leaving at most ten active jobs.
    needs: [scope, static]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned workflow tools
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          curl --fail --silent --show-error --location https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/zizmor.tar.gz"
          echo 'd185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99  '"$RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      - name: Check workflow syntax
        # actionlint 1.7.12 does not know GitHub's queue key. Keep the exception
        # limited to the two merge workflows and this exact schema error.
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml .github/workflows/release.yml
          "$RUNNER_TEMP/actionlint" -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$' .github/workflows/ff-only-merge.yml .github/workflows/ff-merge-comment.yml
      - run: '"$RUNNER_TEMP/zizmor" --no-online-audits --strict-collection .github/workflows .github/actions'

  check:
    # GitHub does not evaluate this name when the duplicate PR job is skipped.
    # Its raw expression name is deliberately not the required Check context.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Use push checks' || 'Check' }}
    if: always() && needs.scope.result != 'skipped'
    needs:
      [
        scope,
        static,
        unit,
        integration,
        image,
        image_main,
        image_arm64,
        workflows,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected job
        env:
          RESULTS: ${{ toJSON(needs) }}
          MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: node tools/ci-check.mjs

  nightly:
    name: Nightly performance and coverage
    needs: check
    # Check accepts correct scope skips; do not inherit their success() gate.
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action is part of the checked out event commit.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]
      - run: pnpm perf:service
      - name: Measure unit and integration coverage
        env:
          NOTESAPP_COVERAGE: 'on'
        run: |
          node tools/run-tests.mjs unit
          tools/test-database/ensure-minio.sh
          node tools/run-tests.mjs integration
      - if: always()
        run: docker compose -p notesapp-test -f compose.test.yaml down --volumes
