name: CI

# A change lands by a fast-forward push of a head that its pull request already
# checked, and the landing needs local `pnpm verify` proof. A push run proves
# nothing new, so the workflow has no `push` trigger. The `Check` job runs on
# each pull request. The full jobs run only by hand, to save the limited minutes
# of the free plan. See record 0224:
# docs/decisions/0224-hosted-ci-runs-the-fast-check-on-each-pull-request.md
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast check. It needs no build and no database.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The change test check of record 0154 compares the branch with
          # main, so the checkout holds the history and origin/main.
          fetch-depth: 0

      # This runs before the Node setup, because the dependency cache of
      # `actions/setup-node` asks pnpm for its store directory.
      - name: Install the pinned package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up the pinned Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Check contract, generated output, types, lint, and format
        run: pnpm contract:lint && pnpm generated:check && pnpm typecheck && pnpm lint && pnpm format:check

  verify:
    name: Verify
    # Runs only when a person starts the workflow by hand, for example for the
    # launch commit or a release candidate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The change test check of record 0154 compares the branch with
          # main, so the checkout holds the history and origin/main.
          fetch-depth: 0

      # This runs before the Node setup, because the dependency cache of
      # `actions/setup-node` asks pnpm for its store directory.
      - name: Install the pinned package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up the pinned Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the disposable test database
        run: docker compose -p notesapp-test -f compose.test.yaml up -d --wait

      - name: Verify source, generated output, tests, and builds
        run: pnpm verify

      - name: Stop the disposable test database
        if: always()
        run: docker compose -p notesapp-test -f compose.test.yaml down --volumes

  performance:
    name: Performance budgets
    # Runs only when a person starts the workflow by hand, for example for the
    # launch commit or a release candidate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up the pinned Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce the initial JavaScript budget
        run: pnpm perf:bundle

      # `perf:service` starts the test database itself.
      - name: Check Search budget and measure advisory Save target
        run: pnpm perf:service

      - name: Stop the disposable test database
        if: always()
        run: docker compose -p notesapp-test -f compose.test.yaml down --volumes

  image:
    name: Image build
    # Runs only when a person starts the workflow by hand, for example for the
    # launch commit or a release candidate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The example values of `.env.example`. They prove that the deployment
    # needs no private address and no undocumented variable.
    env:
      NOTESAPP_ORIGIN: https://notes.example.com
      NOTESAPP_ADDITIONAL_ORIGINS: ''
      NOTESAPP_BIND_HOST: 127.0.0.1
      NOTESAPP_PORT: '3000'
      NOTESAPP_LOG_LEVEL: info
      POSTGRES_USER: postgres
      POSTGRES_DB: notesapp
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set isolated deployment paths
        run: |
          printf '%s\n' \
            "NOTESAPP_SECRETS_DIR=$RUNNER_TEMP/notesapp-secrets" \
            "NOTESAPP_DATABASE_DIR=$RUNNER_TEMP/notesapp-postgres" \
            "NOTESAPP_STORAGE_DIR=$RUNNER_TEMP/notesapp-storage" >> "$GITHUB_ENV"

      - name: Write throwaway deployment secrets
        run: |
          mkdir -p "$NOTESAPP_SECRETS_DIR"
          chmod 700 "$NOTESAPP_SECRETS_DIR"
          for name in postgres_password migration_database_url \
            runtime_database_password auth_database_password \
            runtime_database_url auth_database_url auth_secret; do
            printf '%s' 'ci-placeholder' > "$NOTESAPP_SECRETS_DIR/$name"
            chmod 600 "$NOTESAPP_SECRETS_DIR/$name"
          done

      - name: Check that the deployment Compose file parses
        run: docker compose config --quiet

      - name: Build the application image
        run: docker compose build

      # The image test of record 0202 runs the commands of the entry point in
      # the image that the step above built. It reads no dependency, so the job
      # needs Node and no install.
      - name: Set up the pinned Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Run the commands of the image entry point
        run: node --test tests/image/
