name: Fast forward main

# A person runs this by hand. It moves main to the reviewed head of one pull
# request without a new test run. tools/ff-only-merge.mjs holds every gate.
# See docs/development/fast-forward-merge.md.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Full 40 character head commit SHA that was reviewed
        required: true
        type: string
      dry_run:
        description: Check every gate and write nothing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ff-only-main
  cancel-in-progress: false
  queue: max

jobs:
  fast-forward:
    name: Fast forward main
    permissions:
      contents: write
      pull-requests: read
      checks: read
      statuses: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /tools/ff-only-merge.mjs
            /tools/workspace.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check the gates and fast forward main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node tools/ff-only-merge.mjs

  dispatch-release:
    name: Start main image publication
    needs: fast-forward
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch main publication after the successful merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/tidynotebook/tidynotebook/actions/workflows/release.yml/dispatches -f ref=main
