name: Release core

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

# Serialize each ref. Version approval does not block main or other versions.
concurrency:
  group: release-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release source
    if: github.repository == 'tidynotebook/tidynotebook'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require source proof and release protection
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
        run: node tools/release-workflow.mjs

  build_amd64:
    name: Build and prove amd64
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.image.outputs.artifact-id }}
      artifact-digest: ${{ steps.image.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: image
        uses: ./.github/actions/build-core # zizmor: ignore[self-repository]
        with:
          arch: amd64
          sha: ${{ needs.prepare.outputs.sha }}
          version: ${{ needs.prepare.outputs.version }}

  build_arm64:
    name: Build and prove arm64
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.image.outputs.artifact-id }}
      artifact-digest: ${{ steps.image.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - id: image
        uses: ./.github/actions/build-core # zizmor: ignore[self-repository]
        with:
          arch: arm64
          sha: ${{ needs.prepare.outputs.sha }}
          version: ${{ needs.prepare.outputs.version }}

  publish_main:
    name: Publish main image
    needs: [prepare, build_amd64, build_arm64]
    if: needs.prepare.outputs.version == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # Only an approved main source can reach this job.
      - uses: ./.github/actions/publish-core # zizmor: ignore[self-repository]
        with:
          version: ${{ needs.prepare.outputs.version }}
          sha: ${{ needs.prepare.outputs.sha }}
          amd64-artifact-id: ${{ needs.build_amd64.outputs.artifact-id }}
          amd64-artifact-digest: ${{ needs.build_amd64.outputs.artifact-digest }}
          arm64-artifact-id: ${{ needs.build_arm64.outputs.artifact-id }}
          arm64-artifact-digest: ${{ needs.build_arm64.outputs.artifact-digest }}

  publish_release:
    name: Publish version image
    needs: [prepare, build_amd64, build_arm64]
    if: needs.prepare.outputs.version != 'main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      # The source and environment gates both passed before publication.
      - uses: ./.github/actions/publish-core # zizmor: ignore[self-repository]
        with:
          version: ${{ needs.prepare.outputs.version }}
          sha: ${{ needs.prepare.outputs.sha }}
          amd64-artifact-id: ${{ needs.build_amd64.outputs.artifact-id }}
          amd64-artifact-digest: ${{ needs.build_amd64.outputs.artifact-digest }}
          arm64-artifact-id: ${{ needs.build_arm64.outputs.artifact-id }}
          arm64-artifact-digest: ${{ needs.build_arm64.outputs.artifact-digest }}
