name: Fast forward main by comment

# A user with push access writes ff-merge in a pull request.
# The script checks permission and fast forwards main.

on:
  # Only the trusted workflow commit is checked out. The script checks the
  # author and reads the command as data. It never executes PR code.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions:
  contents: read

jobs:
  fast-forward:
    name: Fast forward main by comment
    permissions:
      contents: write
      pull-requests: write
    # A cheap filter only. The script checks the author with the API.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      (startsWith(github.event.comment.body, 'ff-merge') ||
       startsWith(github.event.comment.body, '/ff-merge'))
    concurrency:
      group: ff-only-main
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /tools/ff-merge-comment.mjs
            /tools/ff-only-merge.mjs
            /tools/workspace.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check permission and fast forward main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_USER_ID: ${{ github.event.comment.user.id }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: node tools/ff-merge-comment.mjs
