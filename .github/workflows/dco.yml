name: DCO

# Record 0188: each commit of a contribution carries a Developer Certificate
# of Origin sign-off. `tools/check-dco.mjs` holds the rule and its test.
#
# `pull_request_target` runs this workflow and the script from the base
# branch, so a pull request cannot change the check that reads it. The job
# reads the commit list through the API and never checks out or runs the code
# of the pull request.
on:
  pull_request_target:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sign-off:
    name: Sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The tip of the base branch, not `base.sha`. `base.sha` is the base
      # commit of the pull request, which can predate the check itself.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Check the sign-off of each commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [[ -n "$PULL_REQUEST" ]]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/commits" --jq 'add'
          else
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/compare/$GROUP_BASE...$GROUP_HEAD" --jq '[.[].commits[]]'
          fi | node tools/check-dco.mjs
