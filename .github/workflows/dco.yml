name: DCO

# Record 0188: each commit of a contribution carries a Developer Certificate
# of Origin sign-off. `tools/check-dco.mjs` holds the rule and its test.
#
# `pull_request_target` runs this workflow and the script from the base
# branch, so a pull request cannot change the check that reads it. The job
# reads the commit list through the API and never checks out or runs the code
# of the pull request.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sign-off:
    name: Sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The tip of the base branch, not `base.sha`. `base.sha` is the base
      # commit of the pull request, which can predate the check itself.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check the sign-off of each commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: >-
          gh api --paginate
          "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/commits"
          | node tools/check-dco.mjs
