packages:
  - apps/*
  - packages/*
  - tools/sdk-codegen
strictPeerDependencies: true
autoInstallPeers: false
saveExact: true
engineStrict: true
linkWorkspacePackages: false
allowBuilds:
  esbuild: false
# Each version that more than one manifest declares sits here once, and each of
# those manifests declares `catalog:`. `tools/check-versions.mjs` resolves the
# reference and holds the exact version rule over the value below, so a range
# still fails the gate.
catalog:
  '@aws-sdk/client-s3': 3.1146.0
  '@codemirror/lang-yaml': 6.1.3
  '@codemirror/language': 6.12.4
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.13
  '@lezer/common': 1.5.3
  '@lezer/highlight': 1.2.5
  '@types/mdast': 4.0.4
  '@types/node': 26.6.3
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/ws': 8.18.1
  diff: 9.0.0
  drizzle-orm: 0.45.3
  fastify: 5.12.5
  katex: 0.18.9
  pg: 8.23.0
  react: 19.3.0
  react-dom: 19.3.0
  react-router: 8.4.0
  sharp: 0.35.5
  yjs: 13.6.33
# TypeScript is the one shared name with two versions. The code generator reads
# a compiler API that the other line does not expose, so each version gets its
# own named catalog and no package can take the other one by accident.
catalogs:
  toolchain:
    typescript: 7.0.2
  codegen:
    typescript: 6.0.3
patchedDependencies:
  mermaid@12.0.0: patches/mermaid@12.0.0.patch
  '@lezer/markdown@1.7.2': patches/@lezer__markdown@1.7.2.patch
  mdast-util-from-markdown@2.0.3: patches/mdast-util-from-markdown@2.0.3.patch
  mdast-util-to-hast@13.2.1: patches/mdast-util-to-hast@13.2.1.patch
  micromark-core-commonmark@2.0.3: patches/micromark-core-commonmark@2.0.3.patch
  micromark@4.0.2: patches/micromark@4.0.2.patch
  parse5@7.3.0: patches/parse5@7.3.0.patch
  unist-util-visit-parents@6.0.2: patches/unist-util-visit-parents@6.0.2.patch
  unist-util-visit@5.1.0: patches/unist-util-visit@5.1.0.patch
# These parent packages pin affected releases. Keep the fixes within the
# same major line. The dependency security tests exercise both refusals.
# Remove each override when its parent selects a fixed release on its own.
overrides:
  lodash-es@4.17.23: 4.18.1
  js-yaml@4.2.0: 4.3.2
  # The archived loader calls only transform and transformSync. Its consumer
  # tests prove those APIs and the TypeScript loader with the fixed compiler.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # Both consumers call renderToString. The web app already uses this release
  # and its prefixed stylesheet. Test the consumer paths before removing these.
  'mermaid>katex': 0.18.9
  'micromark-extension-math>katex': 0.18.9
