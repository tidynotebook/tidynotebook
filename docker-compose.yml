# Production Compose file for one tidy notebook instance.
#
# Five values are required and have no default: NOTESAPP_ORIGIN and the three
# host directories that hold the database, the stored files, and the secrets.
# A directory has no safe default, because a default inside this checkout is
# what an installation took when nobody stated one, and the services write
# those trees as their own users. A directory that the person who runs the
# repository commands cannot read then breaks every command that reads the
# tree. Copy `.env.example` to `.env` and set the values there.
#
# Every other value has a safe default: the listener is published on the
# loopback address, the installation serves the configured origin and nothing
# else, and both services rotate their logs.
services:
  postgres:
    image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-notesapp}
    secrets:
      - postgres_password
    volumes:
      # A host directory, not a named volume, so the host encryption check and
      # the backup and restore scripts can name the same path.
      - ${NOTESAPP_DATABASE_DIR:?Set NOTESAPP_DATABASE_DIR in .env. It names the host directory that holds the database, and it belongs outside this checkout.}:/var/lib/postgresql
    networks:
      - database
    logging:
      driver: json-file
      options:
        max-size: ${NOTESAPP_LOG_MAX_SIZE:-10m}
        max-file: ${NOTESAPP_LOG_MAX_FILE:-5}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notesapp} -q',
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NOTESAPP_IMAGE:-notesapp:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOTESAPP_ORIGIN: ${NOTESAPP_ORIGIN:?set NOTESAPP_ORIGIN in .env to the public URL of this installation, for example https://notes.example.com}
      NOTESAPP_DATABASE_URL_FILE: /run/secrets/runtime_database_url
      NOTESAPP_AUTH_DATABASE_URL_FILE: /run/secrets/auth_database_url
      NOTESAPP_STORAGE_ROOT: /var/lib/notesapp
      NOTESAPP_AUTH_SECRET_FILE: /run/secrets/auth_secret
      # An empty list serves the origin above and nothing else. Add a full
      # origin, with its scheme and its port, only when a second address
      # reaches this installation.
      NOTESAPP_ADDITIONAL_ORIGINS: ${NOTESAPP_ADDITIONAL_ORIGINS:-}
      # A public installation serves each published page from an origin of
      # its own, on a host name that the application does not use. An empty
      # value serves published pages from the origin above.
      NOTESAPP_PUBLISHED_ORIGIN: ${NOTESAPP_PUBLISHED_ORIGIN:-}
      NOTESAPP_LOG_LEVEL: ${NOTESAPP_LOG_LEVEL:-info}
      NOTESAPP_MAX_BODY_BYTES: ${NOTESAPP_MAX_BODY_BYTES:-1048576}
      NOTESAPP_MAX_HEADER_BYTES: ${NOTESAPP_MAX_HEADER_BYTES:-16384}
      # The whole request must arrive inside this time, and that includes the
      # body of an image upload over a slow link. The bound that refuses a
      # sender which delivers almost nothing is the idle bound below.
      NOTESAPP_REQUEST_TIMEOUT_MS: ${NOTESAPP_REQUEST_TIMEOUT_MS:-60000}
      # The longest gap between two chunks of an upload body. It must stay
      # shorter than NOTESAPP_REQUEST_TIMEOUT_MS. An empty value keeps the
      # default that apps/server/src/config.ts states.
      NOTESAPP_UPLOAD_IDLE_TIMEOUT_MS: ${NOTESAPP_UPLOAD_IDLE_TIMEOUT_MS:-}
      NOTESAPP_RATE_LIMIT_WINDOW_S: ${NOTESAPP_RATE_LIMIT_WINDOW_S:-60}
      NOTESAPP_RATE_LIMIT_MAX: ${NOTESAPP_RATE_LIMIT_MAX:-100}
      # The life of one session, in seconds. An empty value keeps the default
      # that apps/server/src/config.ts states.
      NOTESAPP_SESSION_MAX_AGE_S: ${NOTESAPP_SESSION_MAX_AGE_S:-}
      NOTESAPP_HOST: 0.0.0.0
      NOTESAPP_PORT: 3000
      # The proxies whose forwarded headers this installation believes. An
      # empty value believes none of them, which is the default. Name the
      # address or the range of your proxy when one sits in front, and read
      # docs/guide/operations.md before you name a whole range.
      NOTESAPP_TRUSTED_PROXIES: ${NOTESAPP_TRUSTED_PROXIES:-}
      # The stop of the server. An empty value keeps the default that
      # apps/server/src/config.ts states.
      NOTESAPP_SHUTDOWN_GRACE_MS: ${NOTESAPP_SHUTDOWN_GRACE_MS:-}
      NOTESAPP_SHUTDOWN_DEADLINE_MS: ${NOTESAPP_SHUTDOWN_DEADLINE_MS:-}
      # The storage limit of a new account, in bytes, and the life of a new
      # invitation, in hours. An empty value keeps the default that
      # apps/server/src/config.ts states.
      NOTESAPP_ACCOUNT_LIMIT_BYTES: ${NOTESAPP_ACCOUNT_LIMIT_BYTES:-}
      NOTESAPP_INVITATION_LIFETIME_HOURS: ${NOTESAPP_INVITATION_LIFETIME_HOURS:-}
      NOTESAPP_PENDING_ACCOUNT_HOURS: ${NOTESAPP_PENDING_ACCOUNT_HOURS:-}
      NOTESAPP_SIGNUP_DIFFICULTY: ${NOTESAPP_SIGNUP_DIFFICULTY:-}
      # The standing of a new account and, for a locked one, its life before
      # the daily run removes it (record 0189). An empty value keeps every new
      # account active with no removal time.
      NOTESAPP_NEW_ACCOUNT_STANDING: ${NOTESAPP_NEW_ACCOUNT_STANDING:-}
      NOTESAPP_NEW_ACCOUNT_REMOVE_AFTER: ${NOTESAPP_NEW_ACCOUNT_REMOVE_AFTER:-}
      # Who can make an account, invitation or open (record 0206). A value here
      # wins over the accounts page and locks it there. Open needs the mail
      # server and both legal documents in the environment too. An empty value
      # leaves the choice to an administrator.
      NOTESAPP_REGISTRATION_POLICY: ${NOTESAPP_REGISTRATION_POLICY:-}
      # The operator API of a service such as a billing service (record 0190).
      # The file holds one secret, so mount it and name its path in the
      # container. An empty value turns the operator API off.
      NOTESAPP_OPERATOR_TOKEN_FILE: ${NOTESAPP_OPERATOR_TOKEN_FILE:-}
      # The account portal that every account opens from Settings, and that a
      # locked account opens to unlock itself.
      NOTESAPP_ACCOUNT_PORTAL_URL: ${NOTESAPP_ACCOUNT_PORTAL_URL:-}
      # The caps of the whole installation for one month (record 0193): the
      # bytes of the published pages, the bytes of the downloads, and the
      # write and read calls to an S3 store. An empty value sets no cap.
      NOTESAPP_PUBLISHED_TRANSFER_CAP_BYTES: ${NOTESAPP_PUBLISHED_TRANSFER_CAP_BYTES:-}
      NOTESAPP_DOWNLOAD_CAP_BYTES: ${NOTESAPP_DOWNLOAD_CAP_BYTES:-}
      NOTESAPP_OBJECT_WRITE_CAP: ${NOTESAPP_OBJECT_WRITE_CAP:-}
      NOTESAPP_OBJECT_READ_CAP: ${NOTESAPP_OBJECT_READ_CAP:-}
      # The mail transport has a secret, so `docker/compose.mail.yaml` adds
      # it with its sender, or `docker/compose.mail-url.yaml` as one URL.
      # The terms and the privacy notice of a public installation. Name both
      # or neither, each by an address or by a file, with its version.
      # `docker/compose.legal.yaml` mounts the files. A raised version asks
      # every account for consent again.
      NOTESAPP_TERMS_URL: ${NOTESAPP_TERMS_URL:-}
      NOTESAPP_TERMS_VERSION: ${NOTESAPP_TERMS_VERSION:-}
      NOTESAPP_PRIVACY_URL: ${NOTESAPP_PRIVACY_URL:-}
      NOTESAPP_PRIVACY_VERSION: ${NOTESAPP_PRIVACY_VERSION:-}
      # Whether a new password is checked against the range service of Have I
      # Been Pwned. Set it to off for an installation with no outbound network.
      NOTESAPP_BREACH_CHECK: ${NOTESAPP_BREACH_CHECK:-on}
    secrets:
      - runtime_database_url
      - auth_database_url
      - auth_secret
      - migration_database_url
      - runtime_database_password
      - auth_database_password
    ports:
      # Loopback only. Put an HTTPS reverse proxy in front of this address.
      - '${NOTESAPP_BIND_HOST:-127.0.0.1}:${NOTESAPP_PORT:-3000}:3000'
    volumes:
      # The storage root must belong to uid 10001, which is the notesapp user
      # of the image. See docs/guide/self-hosting.md.
      - ${NOTESAPP_STORAGE_DIR:?Set NOTESAPP_STORAGE_DIR in .env. It names the host directory that holds the stored files, and it belongs outside this checkout.}:/var/lib/notesapp
    networks:
      - database
      - frontend
    logging:
      driver: json-file
      options:
        max-size: ${NOTESAPP_LOG_MAX_SIZE:-10m}
        max-file: ${NOTESAPP_LOG_MAX_FILE:-5}
    # The server drains on SIGTERM: it reports that it is not ready, completes
    # the open requests, and closes its resources. This period must stay longer
    # than the stop deadline of the server, so Docker never kills a stop that
    # still runs inside its own budget.
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '/app/healthcheck.mjs']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional TLS front. It starts only with `--profile tls`, so a default
  # `docker compose up` runs the application alone, as before.
  #
  # Caddy answers NOTESAPP_DOMAIN, gets the certificate on its own, and sends
  # every request to the application container. It keeps the original Host
  # header, which the application requires, and it adds the forwarded headers.
  # The application believes those headers only when NOTESAPP_TRUSTED_PROXIES
  # names this proxy. See docs/guide/operations.md.
  caddy:
    image: caddy@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    profiles:
      - tls
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # The domain that this proxy answers. Name it in `.env`. Compose reads
      # every service of this file before it selects a profile, so this value
      # cannot be a required one: that would stop a default start as well. With
      # no value the proxy answers `localhost` with a certificate that it makes
      # itself, which serves a local check and nothing else.
      NOTESAPP_DOMAIN: ${NOTESAPP_DOMAIN:-localhost}
      # The domain of NOTESAPP_PUBLISHED_ORIGIN, which a public installation
      # needs before it opens registration. With no value the proxy answers
      # `pages.localhost`, which serves a local check and nothing else.
      NOTESAPP_PUBLISHED_DOMAIN: ${NOTESAPP_PUBLISHED_DOMAIN:-pages.localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and its private key live here. Put this directory on
      # encrypted host storage, next to the other data directories.
      - ${NOTESAPP_TLS_DIR:-./.tls}/data:/data
      - ${NOTESAPP_TLS_DIR:-./.tls}/config:/config
    ports:
      # Port 80 answers the certificate challenge and sends a browser to HTTPS.
      - '80:80'
      - '443:443'
      - '443:443/udp'
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: ${NOTESAPP_LOG_MAX_SIZE:-10m}
        max-file: ${NOTESAPP_LOG_MAX_FILE:-5}

networks:
  database:
    internal: true
  frontend:

secrets:
  postgres_password:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/postgres_password
  migration_database_url:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/migration_database_url
  runtime_database_password:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/runtime_database_password
  auth_database_password:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/auth_database_password
  runtime_database_url:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/runtime_database_url
  auth_database_url:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/auth_database_url
  auth_secret:
    file: ${NOTESAPP_SECRETS_DIR:?Set NOTESAPP_SECRETS_DIR in .env. It names the host directory that holds the secrets, and it belongs outside this checkout.}/auth_secret
