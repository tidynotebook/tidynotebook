<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <!-- The server writes the one link preview of the installation here at
         start, from its configured origin. See design 028. -->
    <!-- __NOTESAPP_LINK_PREVIEW__ -->
    <meta name="theme-color" content="__NOTESAPP_THEME_COLOUR__" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The build writes one link for each icon it emits, at an address that
         follows the bytes of that icon. See decision 0074. -->
    __NOTESAPP_ICON_LINKS__
    <title>__NOTESAPP_PRODUCT_NAME__</title>
    <script>
      // Apply the saved theme before the first paint so the page never
      // flashes the wrong palette. The palette data is written here at
      // build time from the theme registry of `@notesapp/ui`, so no colour
      // value is kept in this file.
      try {
        var themes = __NOTESAPP_THEMES__;
        var appearance = localStorage.getItem('notesapp.theme') || 'system';
        var family = localStorage.getItem('notesapp.theme-family') || '';
        var dark =
          appearance === 'dark' ||
          (appearance !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        // An imported theme is data of the account (record 0143). The device
        // keeps the palette of the chosen one and paints it only when the
        // stored family names it, so a stale entry is never painted.
        var imported = null;
        if (!themes.families[family]) {
          try {
            var kept = JSON.parse(
              localStorage.getItem('notesapp.theme-imported') || 'null',
            );
            if (kept && kept.family === family) imported = kept.variants;
          } catch (error) {
            imported = null;
          }
        }
        var variants =
          imported ||
          themes.families[family] ||
          themes.families[themes.fallback];
        // A family with one palette answers both appearances with it, so the
        // page states the appearance of the palette that it paints, as
        // `applyTheme` does once React runs.
        var wanted = dark ? 'dark' : 'light';
        var shown = variants[wanted]
          ? wanted
          : variants.dark
            ? 'dark'
            : 'light';
        var theme = variants[shown];
        var root = document.documentElement;
        root.setAttribute('data-theme', shown);
        root.setAttribute('data-theme-id', theme.id);
        // The browser draws the scrollbar, a native control and a remembered
        // field from the colour scheme of the page, and it assumes a light
        // page until the page says otherwise. `applyTheme` writes the same
        // property once React runs.
        root.style.colorScheme = shown;
        // The thumb of every scrollbar is the component edge of the palette
        // and the track is nothing. The value names the property that the
        // loop above wrote, so it follows the palette with no colour here.
        root.style.scrollbarColor = 'var(--notes-border) transparent';
        for (var index = 0; index < themes.properties.length; index += 1)
          root.style.setProperty(themes.properties[index], theme.values[index]);
        root.style.background = theme.values[0];
        var colour = document.querySelector('meta[name="theme-color"]');
        if (colour) colour.setAttribute('content', theme.values[0]);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
    <script>
      // A start that fails before React draws, such as a module of the entry
      // that does not arrive or an error while the entry runs, shows the
      // application screen of record 0161 with Reload instead of a white
      // page. The build draws both screens from `src/start-failure.ts` into
      // the templates below. The first render of React takes the root back.
      (function () {
        var shown = false;
        function show(cause) {
          var root = document.getElementById('root');
          var screen = document.getElementById('start-failure-' + cause);
          if (shown || !root || !screen || root.firstChild) return;
          shown = true;
          root.appendChild(screen.content.cloneNode(true));
          var reload = root.querySelector('button');
          if (reload)
            reload.addEventListener('click', function () {
              window.location.reload();
            });
        }
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') show('load');
            else if (target === window) show('stop');
          },
          true,
        );
        window.addEventListener('unhandledrejection', function () {
          show('stop');
        });
      })();
    </script>
  </head>
  <body
    class="m-0 bg-app font-sans text-ui leading-relaxed text-ink antialiased"
  >
    <template id="start-failure-load">__NOTESAPP_START_FAILURE_LOAD__</template>
    <template id="start-failure-stop">__NOTESAPP_START_FAILURE_STOP__</template>
    <div id="root" class="min-h-viewport"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
