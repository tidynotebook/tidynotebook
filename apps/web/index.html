<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Notesapp: offline notes with versioned history."
    />
    <meta name="theme-color" content="__NOTESAPP_THEME_COLOUR__" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The build writes one link for each icon it emits, at an address that
         follows the bytes of that icon. See decision 0074. -->
    __NOTESAPP_ICON_LINKS__
    <title>Notesapp</title>
    <script>
      // Apply the saved theme before the first paint so the page never
      // flashes the wrong palette. The palette data is written here at
      // build time from the theme registry of `@notesapp/ui`, so no colour
      // value is kept in this file.
      try {
        var themes = __NOTESAPP_THEMES__;
        var appearance = localStorage.getItem('notesapp.theme') || 'system';
        var family = localStorage.getItem('notesapp.theme-family') || '';
        var dark =
          appearance === 'dark' ||
          (appearance !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        // An imported theme is data of the account (record 0141). The device
        // keeps the palette of the chosen one and paints it only when the
        // stored family names it, so a stale entry is never painted.
        var imported = null;
        if (!themes.families[family]) {
          try {
            var kept = JSON.parse(
              localStorage.getItem('notesapp.theme-imported') || 'null',
            );
            if (kept && kept.family === family) imported = kept.variants;
          } catch (error) {
            imported = null;
          }
        }
        var variants =
          imported ||
          themes.families[family] ||
          themes.families[themes.fallback];
        var theme =
          variants[dark ? 'dark' : 'light'] || variants.dark || variants.light;
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.setAttribute('data-theme-id', theme.id);
        // The browser draws the scrollbar, a native control and a remembered
        // field from the colour scheme of the page, and it assumes a light
        // page until the page says otherwise. `applyTheme` writes the same
        // property once React runs.
        root.style.colorScheme = dark ? 'dark' : 'light';
        // The thumb of every scrollbar is the component edge of the palette
        // and the track is nothing. The value names the property that the
        // loop above wrote, so it follows the palette with no colour here.
        root.style.scrollbarColor = 'var(--notes-border) transparent';
        for (var index = 0; index < themes.properties.length; index += 1)
          root.style.setProperty(themes.properties[index], theme.values[index]);
        root.style.background = theme.values[0];
        var colour = document.querySelector('meta[name="theme-color"]');
        if (colour) colour.setAttribute('content', theme.values[0]);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
  </head>
  <body
    class="m-0 bg-app font-sans text-ui leading-relaxed text-ink antialiased"
  >
    <div id="root" class="min-h-viewport"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
