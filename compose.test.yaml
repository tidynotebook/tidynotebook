# Disposable PostgreSQL and MinIO services for the integration tests.
#
# This file is for local checks only. It is not a deployment. Each service
# binds a non default host port, so it cannot collide with an installed
# PostgreSQL or MinIO. Each image is pinned by digest, as the design requires.
#
# `POSTGRES_USER` is the image superuser and is used for initialization only.
# `tools/test-database/init.sql` then creates the migration role
# `notesapp_migrate` and the database `notesapp_test` that it owns. Every test
# connects as that non superuser migration role or as the runtime role
# `notesapp_app`, so row level security is proved under the production role
# model. The passwords below are test values of a throwaway local service.
services:
  postgres:
    image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test
    volumes:
      - ./tools/test-database/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d notesapp_test -q']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # The S3 compatible store of the object store tests (record 0192). MinIO no
  # longer publishes an image of its own, so this is the Chainguard build of
  # MinIO. Its data lives in memory and goes with the container. Each test file
  # makes a bucket of its own and removes it, so several worktrees share the
  # service as they share PostgreSQL. The key pair is a test value of a
  # throwaway local service.
  minio:
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    command: ['server', '/data', '--address', ':9000']
    environment:
      MINIO_ROOT_USER: notesapp
      MINIO_ROOT_PASSWORD: notesapp_test_secret
    tmpfs:
      - /data
    ports:
      - '127.0.0.1:59000:9000'
    # The image holds bash and no HTTP client, so the check speaks HTTP itself.
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/ready HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
