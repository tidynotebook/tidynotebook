# Disposable PostgreSQL service for storage and row access integration tests.
#
# This file is for local checks only. It is not a deployment. The service binds
# a non default host port, so it cannot collide with an installed PostgreSQL.
# The image is pinned by digest, as the design requires.
#
# `POSTGRES_USER` is the image superuser and is used for initialization only.
# `tools/test-database/init.sql` then creates the migration role
# `notesapp_migrate` and the database `notesapp_test` that it owns. Every test
# connects as that non superuser migration role or as the runtime role
# `notesapp_app`, so row level security is proved under the production role
# model. The passwords below are test values of a throwaway local service.
services:
  postgres:
    image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test
    volumes:
      - ./tools/test-database/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d notesapp_test -q']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
